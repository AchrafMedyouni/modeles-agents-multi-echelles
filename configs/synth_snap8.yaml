# Sweep snapshots : 8 instants observés, t_test = 1.25. Même seed que synth_snap5.yaml :
# mêmes particules, observées plus souvent.

seed: 0

# Vrais paramètres du modèle.
model:
  kappa: 1.0
  kappa3: 0.0
  beta: 0.5
  sigma: 0.5
  alpha: 1.0
  gamma: 2.0

simulation:
  n_samples: 2000                    # N particules par snapshot
  dt: 1.0e-3                         # pas d'Euler-Maruyama
  t_obs: [0.0, 0.25, 0.5, 0.75, 1.0, 1.5, 2.0, 3.0]   # instants observés
  t_test: 1.25                       # instant non observé (validation de la densité)
  n_test: 10000                      # particules du snapshot de test (simulation indépendante)
  init:                              # loi initiale gaussienne de (δ, M)
    delta_mean: 1.0
    delta_std: 0.3
    m_mean: 0.0
    m_std: 0.3
