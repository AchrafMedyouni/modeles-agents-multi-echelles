[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pinn_chiarella"
version = "0.1.0"
description = "PINN Fokker-Planck pour l'identification du modèle de Chiarella multi-échelles"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch",
    "numpy",
    "scipy",
    "matplotlib",
    "pyyaml",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "scripts", "tests"]
extend-exclude = ["reference"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
